<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./table.css">
    <title>Table</title>
</head>
<body>
    <h1>Learning how to style Table</h1>
    <table>
        <tr>
            <th>S/N</th>
            <th>Full Name</th>
            <th>Timing</th>
            <th>Month</th>
            <th>Time-Out</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Lasisi Mutmainnah</td>
            <td>8:40</td>
            <td>2</td>
            <td rowspan="4">3:00</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Yusuf Faosiyat</td>
            <td>8:47</td>
            <td>2</td>
            <!-- <td>3:00</td> -->
        </tr>
        <tr>
            <td>3</td>
            <td>Olaitan Yesir</td>
            <td>8:49</td>
            <td>3</td>
            <!-- <td>3:00</td> -->
        </tr>
        <tr>
            <td>4</td>
            <td>Olubunmi lanre</td>
            <td>8:58</td>
            <td>1</td>
            <!-- <td>3:00</td> -->
        </tr>
    </table>
</body>
</html>
