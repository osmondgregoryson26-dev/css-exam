<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Gregorysonosmond.css">
    <title>Student Result Card</title>
    <style>
        *{
    margin: 0;
    padding: 0;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

h1{
    text-align: center;
    margin: auto;
    font-family: sans-serif;
}

table {
    border-collapse: collapse;
    border-radius: 20px;
    border: 1px solid;
    width: 400px;
    height: 200px;
}

tr {
    text-align: center;
}

tr:nth-child(even){
    background-color: #8F979F;
    transition: background-color 1s;
}

tr:hover{
    background-color: aqua;
}

th{
    background-color: black;
    color: white;
}

.card {
    padding: 30px;
    margin-top: 30px;
    position: relative;
    background-color: #8F979F;
    border-radius: 20px;
    box-shadow: 0 0 5px cyan;
    text-align: center;
    width: fit-content;
    height: fit-content;
    margin: auto;
    margin-top: 30px;
}

p{
    margin-top: 5px;
}

.card p:nth-child(3){
    font-size: xx-large;
}

button{
    margin-top: 30px;
    padding: 5px;
    background-color: blue;
    border: none;
}

button:hover{
    background-color: yellow;
}

button:active {
    background-color: red;
}

.badge {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background-color: green;
    color: white;
    font-size: x-small;
    animation:pass 0.7s linear alternate infinite;
}

@keyframes pass {
    from{
        transform: translateY(0);
    }
    to{
        transform: translateY(-5px);
    }
}
    </style>
</head>
<body>
    <div class="wrapper">
    <h1>Student Result Page</h1>
    
    <table>
        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>70</td>
            <td>A</td>
        </tr>
        <tr>
            <td>English</td>
            <td>65</td>
            <td>B</td>
        </tr>
        <tr>
            <td>HTML</td>
            <td>74</td>
            <td>A</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>67</td>
            <td>B</td>
        </tr>
        <tr>
            <td>Javascript</td>
            <td>55</td>
            <td>C</td>
        </tr>

    </table>

     <div class="card">
        <p>Name: John Doe</p>
        <P>Class: SS3</P>
        <p>66.2</p>
        <P>Average Score</P>
        <button>Print Result</button>
        <div class="badge">Pass</div>
    </div>
</div>
</body>
</html>
