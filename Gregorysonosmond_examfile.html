<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./Gregorysonosmond.css">
    <title>Student Result Card</title>
</head>
<body>
    <div class="wrapper">
    <h1>Student Result Page</h1>
    
    <table>
        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>70</td>
            <td>A</td>
        </tr>
        <tr>
            <td>English</td>
            <td>65</td>
            <td>B</td>
        </tr>
        <tr>
            <td>HTML</td>
            <td>74</td>
            <td>A</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>67</td>
            <td>B</td>
        </tr>
        <tr>
            <td>Javascript</td>
            <td>55</td>
            <td>C</td>
        </tr>

    </table>

     <div class="card">
        <p>Name: John Doe</p>
        <P>Class: SS3</P>
        <p>66.2</p>
        <P>Average Score</P>
        <button>Print Result</button>
        <div class="badge">Pass</div>
    </div>
</div>
</body>
</html>
